name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v1
    with:
      command: pnpm check

  end-to-end:
    uses: richardsolomou/ras-stack/.github/workflows/check-browser.yml@v1
    with:
      prepare-command: pnpm build
      command: pnpm test:e2e:run
      artifact-name: playwright-traces
      artifact-path: test-results/

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, end-to-end]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    secrets: inherit
